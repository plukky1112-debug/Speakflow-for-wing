<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<title>SpeakFlow AI</title>
<style>
:root{--ind:#4F46E5;--s:#8B5CF6;--bg:#0F172A;--card:#1E293B;--tx:#F8FAFC;}
body{background:var(--bg);color:var(--tx);font-family:sans-serif;margin:0;height:100dvh;display:flex;flex-direction:column;overscroll-behavior:none;}
#app{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;}
.toolbar{display:flex;justify-content:space-between;padding:15px;background:var(--card);border-bottom:1px solid #334155;}
.msg{padding:12px;margin:8px 0;border-radius:15px;max-width:85%;line-height:1.5;}
.user{background:var(--ind);align-self:flex-end;}
.ai{background:#334155;align-self:flex-start;}
.controls{padding:20px;display:flex;justify-content:center;align-items:center;gap:20px;background:var(--card);}
.mic{width:70px;height:70px;border-radius:50%;background:linear-gradient(var(--ind),var(--s));display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;padding:20px;z-index:1000;}
input,select{width:100%;padding:12px;margin:8px 0;background:#0F172A;border:1px solid #475569;color:white;border-radius:10px;font-size:16px;}
</style>
</head>
<body>
<div class="toolbar">
    <button onclick="openSettings()">⚙️ ตั้งค่า</button>
    <button onclick="location.reload()">↺ รีเซ็ต</button>
</div>
<div id="app"><div id="log"></div></div>
<div class="controls">
    <div class="mic" id="mic" onclick="toggleMic()">🎤</div>
    <div id="status">แตะไมค์เริ่มพูด</div>
</div>

<div id="settings-ui" class="overlay" style="display:none">
    <h3>ตั้งค่า SpeakFlow</h3>
    <input id="api-key" type="password" placeholder="วาง API Key ที่นี่ (AIza... / gsk_...)">
    <button onclick="saveSettings()" style="padding:15px;background:var(--ind);border:none;color:white;border-radius:10px;">บันทึกและเริ่มใช้</button>
    <button onclick="closeSettings()" style="margin-top:10px;padding:10px;background:transparent;">ปิด</button>
</div>

<script>
let cfg = JSON.parse(localStorage.getItem('sf-cfg') || '{"key":""}');
function openSettings() { document.getElementById('api-key').value = cfg.key; document.getElementById('settings-ui').style.display = 'flex'; }
function closeSettings() { document.getElementById('settings-ui').style.display = 'none'; }
function saveSettings() { cfg.key = document.getElementById('api-key').value; localStorage.setItem('sf-cfg', JSON.stringify(cfg)); closeSettings(); alert("บันทึกแล้ว!"); }

function toggleMic() {
    if(!cfg.key) { openSettings(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR();
    r.lang = 'en-US';
    r.onstart = () => { document.getElementById('status').innerText = "ฟังอยู่..."; };
    r.onresult = (e) => {
        const text = e.results[0][0].transcript;
        appendMsg('user', text);
        chatAI(text);
    };
    r.start();
}

function appendMsg(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerText = text;
    document.getElementById('log').appendChild(d);
}

async function chatAI(text) {
    document.getElementById('status').innerText = "AI กำลังวิเคราะห์...";
    try {
        const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=" + cfg.key, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: "You are an English coach. Learner: " + text }] }] })
        });
        const data = await res.json();
        appendMsg('ai', data.candidates[0].content.parts[0].text);
        document.getElementById('status').innerText = "แตะไมค์เริ่มพูด";
    } catch(e) {
        appendMsg('ai', "ผิดพลาด: ตรวจสอบ API Key");
        document.getElementById('status').innerText = "แตะไมค์เริ่มพูด";
    }
}
</script>
</body>
</html>
