<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<title>SpeakFlow AI</title>
<style>
:root{--ind:#4F46E5;--s:#8B5CF6;--bg:#0F172A;--card:#1E293B;--tx:#F8FAFC;}
body{background:var(--bg);color:var(--tx);font-family:sans-serif;margin:0;height:100dvh;display:flex;flex-direction:column;}
#app{flex:1;overflow-y:auto;padding:20px;}
.toolbar{display:flex;justify-content:space-between;padding:10px;background:var(--card);}
button{padding:10px;border-radius:10px;border:none;background:var(--card);color:white;cursor:pointer;}
.mic-btn{width:80px;height:80px;border-radius:50%;background:linear-gradient(var(--),var(--s));margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:30px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.box{background:var(--card);padding:20px;border-radius:20px;width:100%;}
input,select{width:100%;padding:10px;margin:10px 0;background:var(--bg);border:1px solid #334155;color:white;border-radius:8px;}
</style>
</head>
<body>
<div class="toolbar">
    <button onclick="renderSettings()">⚙️ ตั้งค่า</button>
    <button onclick="clearChat()">เริ่มใหม่</button>
</div>
<div id="app">
    <div id="chat-log"></div>
    <div class="mic-btn" id="mic" onclick="toggleMic()">🎤</div>
    <div id="status" style="text-align:center">กดไมค์เพื่อเริ่มพูด</div>
</div>

<div id="settings-overlay" class="overlay" style="display:none">
    <div class="box">
        <h3>ตั้งค่า API Key</h3>
        <input id="api-key" type="password" placeholder="วาง API Key ที่นี่ (AIza... หรือ gsk_...)">
        <button onclick="saveSettings()" style="width:100%;background:var(--)">บันทึก</button>
    </div>
</div>

<script>
let cfg = JSON.parse(localStorage.getItem('sf-cfg') || '{"key":""}');
let msgs = [];

function renderSettings() { document.getElementById('settings-overlay').style.display = 'flex'; }

function saveSettings() {
    cfg.key = document.getElementById('api-key').value;
    localStorage.setItem('sf-cfg', JSON.stringify(cfg));
    document.getElementById('settings-overlay').style.display = 'none';
    alert("บันทึกแล้ว!");
}

function toggleMic() {
    if(!cfg.key) { alert("กรุณาใส่ API Key ก่อน!"); renderSettings(); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR();
    r.lang = 'en-US';
    r.onstart = () => { document.getElementById('status').innerText = "กำลังฟัง..."; };
    r.onresult = (e) => {
        const text = e.results[0][0].transcript;
        addMsg('user', text);
        getAIResponse(text);
    };
    r.start();
}

function addMsg(role, text) {
    const div = document.createElement('div');
    div.style.margin = "10px 0";
    div.style.padding = "10px";
    div.style.borderRadius = "10px";
    div.style.background = role === 'user' ? '#4f46e5' : '#334155';
    div.innerText = text;
    document.getElementById('chat-log').appendChild(div);
}

async function getAIResponse(userText) {
    document.getElementById('status').innerText = "AI กำลังคิด...";
    try {
        const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=" + cfg.key, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: "Respond as an English coach. Learner said: " + userText }] }] })
        });
        const data = await res.json();
        const reply = data.candidates[0].content.parts[0].text;
        addMsg('ai', reply);
        document.getElementById('status').innerText = "กดไมค์เพื่อตอบ";
    } catch(e) {
        addMsg('ai', "Error: เช็ค API Key หรือ Internet อีกครั้ง");
    }
}

function clearChat() { document.getElementById('chat-log').innerHTML = ""; }
</script>
</body>
</html>
