<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
<title>SpeakFlow AI</title>
<style>
body { background: #0f172a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100dvh; margin: 0; padding: 20px; }
.msg { padding: 12px; margin: 10px 0; border-radius: 15px; background: #334155; }
.user { background: #6366f1; align-self: flex-end; }
</style>
</head>
<body>
    <div id="log" style="flex:1; overflow-y:auto;"></div>
    <div onclick="startMic()" style="text-align:center; padding:20px; background:#1e293b; border-radius:20px;">🎤 แตะไมค์พูด</div>
    <button onclick="setKey()" style="margin-top:10px;">⚙️ ตั้งค่า API Key ใหม่</button>

<script>
function setKey(){ 
    let k = prompt("ใส่ API Key ของคุณ:"); 
    if(k) { localStorage.setItem('key', k); alert("บันทึกแล้ว"); } 
}

async function startMic(){
    if(!localStorage.getItem('key')) { setKey(); return; }
    const sr = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    sr.onresult = async (e) => {
        let txt = e.results[0][0].transcript;
        document.getElementById('log').innerHTML += `<div class="msg user">${txt}</div>`;
        
        try {
            let res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+localStorage.getItem('key'), {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({contents:[{parts:[{text: "You are an English coach. Respond in one sentence: " + txt}]}]})
            });
            let data = await res.json();
            let reply = data.candidates[0].content.parts[0].text;
            document.getElementById('log').innerHTML += `<div class="msg">${reply}</div>`;
        } catch(err) { alert("เชื่อมต่อไม่ได้: " + err); }
    };
    sr.start();
}
</script>
</body>
</html>
